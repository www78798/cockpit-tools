name: Docker GUI image

on:
  push:
    branches: [main, feature/docker-gui]
    paths:
      - "docker/**"
      - "docker-compose.yml"
      - ".dockerignore"
      - ".github/workflows/docker-gui.yml"
  pull_request:
    paths:
      - "docker/**"
      - "docker-compose.yml"
      - ".dockerignore"
      - ".github/workflows/docker-gui.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-smoke-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build desktop image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          tags: cockpit-tools-desktop:ci
          load: true

      - name: Check installed release and runtime dependencies
        run: |
          docker run --rm --entrypoint bash cockpit-tools-desktop:ci -lc '
            command -v cockpit-tools
            dpkg-query -W -f="${Version}\\n" cockpit-tools
            command -v Xvfb
            command -v x11vnc
            command -v websockify
            test -d /usr/share/novnc
            ldd "$(command -v cockpit-tools)" | tee /tmp/cockpit-ldd.txt
            ! grep -q "not found" /tmp/cockpit-ldd.txt
          '

      - name: Launch desktop and verify noVNC endpoint
        shell: bash
        run: |
          set -euo pipefail
          docker run -d --name cockpit-tools-smoke -p 127.0.0.1:6080:6080 cockpit-tools-desktop:ci
          cleanup() { docker logs cockpit-tools-smoke || true; docker rm -f cockpit-tools-smoke >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:6080/vnc.html >/dev/null; then
              echo "noVNC is responding"
              exit 0
            fi
            if ! docker inspect -f '{{.State.Running}}' cockpit-tools-smoke | grep -q true; then
              echo "Container exited before noVNC became ready"
              exit 1
            fi
            sleep 2
          done
          echo "Timed out waiting for noVNC"
          exit 1
